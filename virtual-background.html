<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meridian Wealth Planning — Virtual Background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --navy:#0f2b46; --navy-700:#153a5e; --navy-900:#081a2c; --teal:#1f8a76; --gold:#d7a23e;
      --cream:#f7f3ec;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    .bg{
      width:1920px;height:1080px;position:relative;overflow:hidden;
      background:
        radial-gradient(80% 90% at 78% 8%, #235784 0%, rgba(35,87,132,0) 55%),
        radial-gradient(90% 100% at 12% 100%, #12503f 0%, rgba(18,80,63,0) 45%),
        linear-gradient(135deg, var(--navy-900) 0%, var(--navy) 45%, var(--navy-700) 100%);
      font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;
    }
    /* subtle meridian arcs */
    .arcs{position:absolute;inset:0;opacity:.20}
    .arcs svg{position:absolute;right:-160px;top:-160px;width:1200px;height:1200px}
    /* faint grid dots bottom-left */
    .dots{position:absolute;left:60px;bottom:60px;width:420px;height:260px;opacity:.10;
      background-image:radial-gradient(#ffffff 1.4px, transparent 1.4px);
      background-size:26px 26px}
    /* large watermark shield bottom-right */
    .watermark{position:absolute;right:-120px;bottom:-160px;color:var(--teal);opacity:.14}

    /* top-left logo lockup */
    .logo{position:absolute;top:70px;left:80px;display:flex;align-items:center;gap:18px}
    .logo svg{color:var(--gold)}
    .logo b{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:40px;line-height:1;
      color:#fff;font-optical-sizing:none;font-variation-settings:"opsz" 40}
    .logo b span{display:block;font-family:"Inter",sans-serif;font-weight:600;font-size:15px;
      letter-spacing:.34em;text-transform:uppercase;color:#bcd3cb;margin-top:9px}

    /* lower-left name plate */
    .plate{position:absolute;left:80px;bottom:84px;max-width:760px}
    .plate .accent{width:70px;height:5px;border-radius:3px;
      background:linear-gradient(90deg,var(--gold),var(--teal));margin-bottom:22px}
    .plate h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:58px;line-height:1.02;
      margin:0;color:#fff;font-optical-sizing:none;font-variation-settings:"opsz" 60}
    .plate .title{font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
      font-weight:600;margin-top:14px}
    .plate .tag{font-size:20px;color:#c3d3df;margin-top:16px;line-height:1.5;max-width:640px}

    /* bottom-right contact */
    .contact{position:absolute;right:86px;bottom:90px;text-align:right;z-index:2}
    .contact .site{font-size:24px;font-weight:700;color:#fff;letter-spacing:.01em}
    .contact .phone{font-size:20px;color:#c3d3df;margin-top:10px;font-weight:500}

    /* bottom accent strip */
    .strip{position:absolute;left:0;right:0;bottom:0;height:8px;
      background:linear-gradient(90deg,var(--teal),var(--gold))}
  </style>
</head>
<body>
  <div class="bg">
    <div class="arcs">
      <svg viewBox="0 0 600 600" fill="none" stroke="#8fb4cf" stroke-width="1.2">
        <circle cx="300" cy="300" r="120"/><circle cx="300" cy="300" r="200"/>
        <circle cx="300" cy="300" r="280"/><circle cx="300" cy="300" r="360"/>
      </svg>
    </div>
    <div class="dots"></div>
    <div class="watermark">
      <svg viewBox="0 0 32 32" width="620" height="620" fill="none">
        <path d="M16 2L4 8v8c0 7.2 5 11.8 12 14 7-2.2 12-6.8 12-14V8L16 2z" fill="currentColor" opacity="0.35"/>
        <path d="M16 2L4 8v8c0 7.2 5 11.8 12 14 7-2.2 12-6.8 12-14V8L16 2z" stroke="currentColor" stroke-width="1.1"/>
        <path d="M10 16l4 4 8-9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="logo">
      <svg viewBox="0 0 32 32" width="60" height="60" fill="none">
        <path d="M16 2L4 8v8c0 7.2 5 11.8 12 14 7-2.2 12-6.8 12-14V8L16 2z" fill="currentColor" opacity="0.18"/>
        <path d="M16 2L4 8v8c0 7.2 5 11.8 12 14 7-2.2 12-6.8 12-14V8L16 2z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 16l4 4 8-9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <b>Meridian<span>Wealth Planning</span></b>
    </div>

    <div class="plate">
      <div class="accent"></div>
      <h1>Kunal Joshi</h1>
      <div class="title">Wealth Planning Advisor</div>
      <p class="tag">Defensive planning &amp; tax-advantaged strategies for individuals and families.</p>
    </div>

    <div class="contact">
      <div class="site">meridian-wealthplanning.com</div>
      <div class="phone">+1 (732) 630-5923</div>
    </div>

    <div class="strip"></div>
  </div>
</body>
</html>
